name: Build iOS Local for SideStore
on:
  workflow_dispatch:
jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: 🛑 Cancel Previous Runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}

      - name: 📂 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: ⚡ Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm install

      - name: 🛠️ Prebuild proyecto nativo iOS
        run: npx expo prebuild --platform ios --clean

      - name: 🍫 Instalar Pods
        run: |
          cd ios
          pod install --repo-update

      - name: 🔎 Detectar workspace y scheme
        id: detect
        run: |
          cd ios
          echo "Contenido de ios/:"
          ls -la

          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          # El scheme de la app se llama igual que el .xcodeproj
          SCHEME=$(basename "$(ls -d *.xcodeproj | head -n 1)" .xcodeproj)
          echo "Workspace: $WORKSPACE"
          echo "Scheme: $SCHEME"

          echo "Schemes disponibles:"
          xcodebuild -workspace "$WORKSPACE" -list

          echo "workspace=$WORKSPACE" >> "$GITHUB_OUTPUT"
          echo "scheme=$SCHEME" >> "$GITHUB_OUTPUT"

      - name: 🍎 Build iOS (unsigned, para sideload)
        run: |
          cd ios
          xcodebuild archive \
            -workspace "${{ steps.detect.outputs.workspace }}" \
            -scheme "${{ steps.detect.outputs.scheme }}" \
            -configuration Release \
            -archivePath "$GITHUB_WORKSPACE/build/App.xcarchive" \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            SKIP_INSTALL=NO

      - name: 📦 Empaquetar IPA sin firmar
        run: |
          APP=$(find "$GITHUB_WORKSPACE/build/App.xcarchive" -maxdepth 4 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then
            echo "No se encontró .app. Contenido del archive:"
            find "$GITHUB_WORKSPACE/build/App.xcarchive" -maxdepth 4
            exit 1
          fi
          echo "App encontrada: $APP"
          mkdir -p "$GITHUB_WORKSPACE/Payload"
          cp -R "$APP" "$GITHUB_WORKSPACE/Payload/"
          cd "$GITHUB_WORKSPACE"
          zip -qr App-unsigned.ipa Payload
          ls -la App-unsigned.ipa

      - name: 🚀 Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-sidestore-app
          path: App-unsigned.ipa